# Environnement de test local de ParaBank
# Lancement :  docker compose up -d && ./scripts/wait-for-parabank.sh
# Arrêt     :  docker compose down
#
# L'image est figée par son digest (ADR-0001, docs/environnement.md) : on teste toujours exactement la même
# version de ParaBank (baseline de l'objet de test). Changer de version = nouveau digest + entrée dans
# l'historique de docs/environnement.md.

services:
  parabank:
    # parasoft/parabank:latest au 2026-10-18 (index multi-architecture linux/amd64 + linux/arm64)
    image: parasoft/parabank@sha256:5343aebd0bd2dbcc26fd41903a4271fb9b2ff19436c712dd9041a43782459b0f
    container_name: parabank
    ports:
      - "8080:8080"     # application web et services REST/SOAP
      - "61616:61616"   # broker JMS (fournisseur de prêt JMS)
      - "9001:9001"     # base de données HyperSQL
    healthcheck:
      # L'image ne contient ni wget ni curl : requête HTTP faite en bash pur (/dev/tcp).
      # « healthy » = application déployée qui répond : 200, ou 302 vers initializeDB.htm tant que la base
      # n'a pas été initialisée. scripts/wait-for-parabank.sh attend, lui, un vrai 200 (base prête).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /parabank/index.htm HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -qE ' (200|302) '"]
      interval: 10s
      timeout: 5s
      retries: 12
